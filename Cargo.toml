[package]
name = "iroh-util"
version = "0.6.3"
edition = "2024"
description = "Utilities for iroh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0-computer/iroh-util"
authors = ["n0 team"]
documentation = "https://docs.rs/iroh-util"
keywords = ["iroh", "p2p", "quic", "connection-pool"]
categories = ["network-programming"]
readme = "README.md"
rust-version = "1.91"
exclude = [
    "Cargo.toml.orig",
    ".github",
    ".gitignore",
    "Makefile.toml",
    "cliff.toml",
]

[dependencies]
derive_more = { version = "2.1.1", features = ["debug"] }
iroh = { version = "1", default-features = false }
n0-error = "1"
n0-future = "0.3.2"
tokio = { version = "1.48.0", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
iroh = "1"
n0-tracing-test = "0.3.0"
testresult = "0.4.1"
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
iroh = { git = "https://forge.emrul.dev/Aster/iroh.git", rev = "34ad5b111e876ad8ad554f73a3b8e93b00fbc327" }
iroh-base = { git = "https://forge.emrul.dev/Aster/iroh.git", rev = "34ad5b111e876ad8ad554f73a3b8e93b00fbc327" }
iroh-relay = { git = "https://forge.emrul.dev/Aster/iroh.git", rev = "34ad5b111e876ad8ad554f73a3b8e93b00fbc327" }
noq = { git = "https://forge.emrul.dev/Aster/noq.git", rev = "de89867c975192d69438164bada087506133c5a4" }
noq-udp = { git = "https://forge.emrul.dev/Aster/noq.git", rev = "de89867c975192d69438164bada087506133c5a4" }
noq-proto = { git = "https://forge.emrul.dev/Aster/noq.git", rev = "de89867c975192d69438164bada087506133c5a4" }
